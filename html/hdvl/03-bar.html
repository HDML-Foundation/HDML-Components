<!doctype html>
<!--
  03 — Bar chart (Chart.js: "bar", horizontal bar, floating bars)

  MOCK — see SPEC.md. Binding modes: subscription (local frame +
  direct static source). Shows: orientation DERIVED from which channel
  resolves to the band scale (one hdml-bar tag, no orientation
  attribute); floating bars via bound y0/y1; hover state styling via
  the _hover suffix convention.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>03 — Bar</title>
    <script src="/bin/components.min.js"></script>
    <style>
      body { margin: 2rem; font-family: system-ui, sans-serif; }
      figure { margin: 0 0 3rem; max-width: 760px; }

      hdml-view { width: 100%; height: 300px; }
      hdml-cartesian-plane { padding: 16px 24px 40px 64px; }
      hdml-ordinal-scale[channel="x"] { padding: 0 16px; }
      hdml-ordinal-scale[channel="y"] { padding: 12px 0; }
      hdml-continuous-scale[channel="y"] { padding: 8px 0; }
      hdml-continuous-scale[channel="x"] { padding: 0 8px; }

      hdml-axis[channel="x"] { position: absolute; left: 0; right: 0; bottom: 0;
        --hdml-line-width: 1px; --hdml-line-color: #64748b; }
      hdml-axis[channel="y"] { position: absolute; top: 0; bottom: 0; left: 0;
        --hdml-line-width: 1px; --hdml-line-color: #64748b; }
      hdml-label { --hdml-font-size: 11px; }
      hdml-label[channel="x"] { position: absolute; left: 0; right: 0; top: 100%; }
      hdml-label[channel="y"] { position: absolute; top: 0; bottom: 0; right: 100%; }
      hdml-grid[channel="y"], hdml-grid[channel="x"] {
        --hdml-line-width: 1px; --hdml-line-style: dotted; --hdml-line-color: #cbd5e1; }

      /* band inner padding is CSS, not an attribute (SPEC §6) */
      hdml-ordinal-scale { --hdml-bandwidth: 0.7; }

      hdml-bar { --hdml-fill-color: #1c8cf4; --hdml-fill-color_hover: #0f6ac2; }
      figure.floating hdml-bar { --hdml-fill-color: #f59e0b; }
    </style>
  </head>
  <body>
    <hdml-io host="https://hdio.example.com" tenant="demo"
             token="…single-use handoff code…"></hdml-io>

    <hdml-frame name="region_rev" source="/warehouse/sales.html?hdml-model=sales">
      <!-- model-sourced frame: parent fields surface as {table}_{field} -->
      <hdml-field name="region" origin="orders_region" type="utf-8"></hdml-field>
      <hdml-field name="revenue" origin="orders_revenue" type="float-64"
                  aggregation="sum"></hdml-field>
      <hdml-group-by><hdml-field name="region"></hdml-field></hdml-group-by>
      <hdml-sort-by><hdml-field name="revenue" order="desc"></hdml-field></hdml-sort-by>
    </hdml-frame>

    <figure>
      <figcaption id="cap-vertical">A — vertical: x→band, y→linear ⇒ derived vertical</figcaption>
      <hdml-view aria-labelledby="cap-vertical">
        <hdml-cartesian-plane source="?hdml-frame=region_rev">
          <hdml-ordinal-scale channel="x" values="region">
            <hdml-continuous-scale channel="y" min="0" values="revenue" nice>
              <hdml-grid channel="y" count="5"></hdml-grid>
              <hdml-axis channel="x"></hdml-axis>
              <hdml-axis channel="y"></hdml-axis>
              <hdml-label channel="x"></hdml-label>
              <hdml-label channel="y" count="5" format="compact-short"></hdml-label>
              <hdml-bar x="region" y="revenue"></hdml-bar>
            </hdml-continuous-scale>
          </hdml-ordinal-scale>
        </hdml-cartesian-plane>
      </hdml-view>
    </figure>

    <figure>
      <figcaption id="cap-horizontal">B — horizontal: same tag, channels swapped</figcaption>
      <hdml-view aria-labelledby="cap-horizontal">
        <hdml-cartesian-plane source="?hdml-frame=region_rev">
          <hdml-ordinal-scale channel="y" values="region">
            <hdml-continuous-scale channel="x" min="0" values="revenue" nice>
              <hdml-grid channel="x" count="5"></hdml-grid>
              <hdml-axis channel="x"></hdml-axis>
              <hdml-axis channel="y"></hdml-axis>
              <hdml-label channel="x" count="5" format="compact-short"></hdml-label>
              <hdml-label channel="y"></hdml-label>
              <hdml-bar x="revenue" y="region"></hdml-bar>
            </hdml-continuous-scale>
          </hdml-ordinal-scale>
        </hdml-cartesian-plane>
      </hdml-view>
    </figure>

    <figure class="floating">
      <figcaption id="cap-floating">C — floating bars (bound y0/y1): monthly temperature range</figcaption>
      <hdml-view aria-labelledby="cap-floating">
        <!-- direct static source — no local frame declaration needed -->
        <hdml-cartesian-plane source="/warehouse/weather.html?hdml-frame=monthly_temps">
          <hdml-ordinal-scale channel="x" values="month">
            <!-- A TRUE two-column range (t_min..t_max): a scale subscribes
                 to one column, so neither end can come from rule 2 —
                 author both (or add frame fields). SPEC §6. -->
            <hdml-continuous-scale channel="y" min="-10" max="40">
              <hdml-grid channel="y" count="6"></hdml-grid>
              <hdml-axis channel="x"></hdml-axis>
              <hdml-axis channel="y"></hdml-axis>
              <hdml-label channel="x"></hdml-label>
              <hdml-label channel="y" count="6"></hdml-label>
              <hdml-bar x="month" y0="t_min" y1="t_max"></hdml-bar>
            </hdml-continuous-scale>
          </hdml-ordinal-scale>
        </hdml-cartesian-plane>
      </hdml-view>
    </figure>
  </body>
</html>
