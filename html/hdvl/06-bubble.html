<!doctype html>
<!--
  06 — Bubble (Chart.js: "bubble")

  MOCK — see SPEC.md. Binding modes: subscription. The scatterplot's
  4th dimension: size channel through hdml-continuous-scale (perceptually
  honest — area ∝ value), range from --hdml-size-min/-max; color by
  region through the chromatic scale, legend = hdml-legend.
  All four bound channels resolve to four scales in scope (V1).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>06 — Bubble</title>
    <script src="/bin/components.min.js"></script>
    <style>
      body { margin: 2rem; font-family: system-ui, sans-serif; }
      figure { margin: 0; max-width: 760px; }

      hdml-view { width: 100%; height: 380px; }
      hdml-cartesian-plane { padding: 16px 130px 40px 64px; }
      hdml-continuous-scale[channel="x"] { padding: 0 12px; }
      hdml-continuous-scale[channel="y"] { padding: 12px 0; }

      hdml-axis[channel="x"] { position: absolute; left: 0; right: 0; bottom: 0;
        --hdml-line-width: 1px; --hdml-line-color: #64748b; }
      hdml-axis[channel="y"] { position: absolute; top: 0; bottom: 0; left: 0;
        --hdml-line-width: 1px; --hdml-line-color: #64748b; }
      hdml-grid { --hdml-line-width: 1px; --hdml-line-style: dotted;
        --hdml-line-color: #e2e8f0; }
      hdml-label { --hdml-font-size: 11px; }
      hdml-label[channel="x"] { position: absolute; left: 0; right: 0; top: 100%; }
      hdml-label[channel="y"] { position: absolute; top: 0; bottom: 0; right: 100%; }
      hdml-legend { position: absolute; top: 8px; left: 100%;
        width: 120px; --hdml-font-size: 11px; }

      /* size range lives on the size-channel scale */
      hdml-continuous-scale[channel="size"] { --hdml-size-min: 4px; --hdml-size-max: 28px; }
      hdml-ordinal-scale[channel="color"] { --hdml-palette: #1c8cf4 #f59e0b #10b981 #8b5cf6; }

      hdml-point { --hdml-tick-style: ellipse; --hdml-line-width: 1px;
        --hdml-line-color: #0f172a40; }
    </style>
  </head>
  <body>
    <hdml-io host="https://hdio.example.com" tenant="demo"
             token="…single-use handoff code…"></hdml-io>

    <hdml-frame name="region_product" source="/warehouse/sales.html?hdml-model=sales">
      <!-- model-sourced frame: parent fields surface as {table}_{field} -->
      <hdml-field name="region" origin="orders_region" type="utf-8"></hdml-field>
      <hdml-field name="product" origin="orders_product" type="utf-8"></hdml-field>
      <hdml-field name="units" origin="orders_units" type="int-32"
                  aggregation="sum"></hdml-field>
      <hdml-field name="margin" type="float-64"
        clause="AVG((orders_revenue - orders_cost) / NULLIF(orders_revenue, 0))"></hdml-field>
      <hdml-field name="revenue" origin="orders_revenue" type="float-64"
                  aggregation="sum"></hdml-field>
      <hdml-group-by>
        <hdml-field name="region"></hdml-field>
        <hdml-field name="product"></hdml-field>
      </hdml-group-by>
      <hdml-sort-by><hdml-field name="revenue" order="desc"></hdml-field></hdml-sort-by>
    </hdml-frame>

    <figure>
      <figcaption id="cap-bubble">Units vs. margin; bubble area = revenue; color = region</figcaption>
      <hdml-view aria-labelledby="cap-bubble">
        <hdml-cartesian-plane source="?hdml-frame=region_product">
          <hdml-continuous-scale channel="x" min="0" values="units" nice>
            <hdml-continuous-scale channel="y" values="margin" nice>
              <hdml-continuous-scale channel="size" type="sqrt" min="0" values="revenue" nice>
                <hdml-ordinal-scale channel="color" values="region">
                  <hdml-grid channel="x" count="6"></hdml-grid>
                  <hdml-grid channel="y" count="5"></hdml-grid>
                  <hdml-axis channel="x"></hdml-axis>
                  <hdml-axis channel="y"></hdml-axis>
                  <hdml-label channel="x" count="6" format="compact-short"></hdml-label>
                  <hdml-label channel="y" count="5" format="percent precision-integer"></hdml-label>

                  <hdml-point x="units" y="margin"
                              size="revenue" color="region"></hdml-point>

                  <hdml-legend channel="color"></hdml-legend>
                </hdml-ordinal-scale>
              </hdml-continuous-scale>
            </hdml-continuous-scale>
          </hdml-continuous-scale>
        </hdml-cartesian-plane>
      </hdml-view>
    </figure>
  </body>
</html>
