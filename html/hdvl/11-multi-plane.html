<!doctype html>
<!--
  11 — Multiple planes in one view (SPEC §4.8)

  MOCK — see SPEC.md. Binding modes: subscription. The composition the
  PoC's index.html proved (two planes side by side) — restored and
  extended. Two figures:
    A — SMALL MULTIPLES: three side-by-side planes, one view-level
        source, one query (identical refs coalesce). Comparable panels
        by pointing every y scale at the same domain source
        (values="series_max") — cross-panel comparability is explicit,
        never inferred.
    B — OVERLAY: a full-bleed context plane behind a padded detail
        plane. Overlay ≠ dual axis (07): sibling y scales put two
        coordinate systems on ONE plot region; overlapping planes put
        two PLOT REGIONS (own padding, own guides, own chain) on one
        canvas. DOM order = paint order across planes: detail second,
        so it paints over the context.
  V13 all the way down: view holds planes; planes hold scales; widgets
  at the tips. A plane contributes no dimension — it is the geometric
  anchor (CSS box + projection) the scale chains build their spaces
  in. Scales never cross a plane boundary (a range belongs to its
  plane's geometry); data and domains do (source inheritance + query
  coalescing; shared values= for comparable panels). Panel titles are
  host HTML positioned over the view.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>11 — Multiple planes</title>
    <script src="/bin/components.min.js"></script>
    <style>
      body { margin: 2rem; font-family: system-ui, sans-serif; }
      figure { margin: 0 0 3rem; max-width: 780px; position: relative; }

      hdml-view { width: 100%; height: 280px; }

      /* ============ A — small multiples: a 1×3 panel row ============ */
      /* planes default to position:absolute; inset:0 (SPEC §3), so a panel
         only has to narrow itself and release the right edge */
      figure.panels hdml-cartesian-plane { width: 33.333%; right: auto;
        padding: 16px 12px 32px 44px; }
      figure.panels hdml-cartesian-plane.south { left: 33.333%; }
      figure.panels hdml-cartesian-plane.east  { left: 66.666%; }

      figure.panels hdml-bar { --hdml-fill-color: #1c8cf4; }
      figure.panels .south hdml-bar { --hdml-fill-color: #f59e0b; }
      figure.panels .east  hdml-bar { --hdml-fill-color: #10b981; }

      /* panel titles: host HTML overlaid on the view (a view's children
         are planes — V13 — so titles live outside it) */
      figure.panels .titles { position: absolute; top: 0; left: 0; right: 0;
        display: flex; pointer-events: none; font-size: 12px; color: #475569; }
      figure.panels .titles span { width: 33.333%; text-align: center; }

      /* ============ B — overlay: context behind detail ============ */
      /* both overlay planes keep the default full-bleed box; only padding differs */
      figure.overlay hdml-cartesian-plane.context { padding: 0; }  /* full-bleed */
      figure.overlay hdml-cartesian-plane.detail  { padding: 16px 24px 40px 56px; }

      figure.overlay .context hdml-area { --hdml-fill-color: #e2e8f0;
        --hdml-curve-type: step; }
      figure.overlay .detail hdml-line { --hdml-line-width: 2px;
        --hdml-line-color: #f59e0b; --hdml-curve-type: monotone; }

      /* shared guide styling */
      hdml-axis[channel="x"] { position: absolute; left: 0; right: 0; bottom: 0;
        --hdml-line-width: 1px; --hdml-line-color: #64748b; }
      hdml-axis[channel="y"] { position: absolute; top: 0; bottom: 0; left: 0;
        --hdml-line-width: 1px; --hdml-line-color: #64748b; }
      hdml-label { --hdml-font-size: 11px; }
      hdml-label[channel="x"] { position: absolute; left: 0; right: 0; top: 100%; }
      hdml-label[channel="y"] { position: absolute; top: 0; bottom: 0; right: 100%; }

      /* point placement for the polyline charts */
      hdml-ordinal-scale.points { --hdml-bandwidth: 0; }
    </style>
  </head>
  <body>
    <hdml-io host="https://hdio.example.com" tenant="demo"
             token="…single-use handoff code…"></hdml-io>

    <!-- same wide frame as 04 (see there for the field commentary);
         series_max doubles here as the SHARED panel domain -->
    <hdml-frame name="regional_m" source="/warehouse/sales.html?hdml-model=sales">
      <hdml-field name="month" type="utf-8"
        clause="format_datetime(orders_order_month, 'MMM')"></hdml-field>
      <hdml-field name="north" type="float-64"
        clause="SUM(CASE WHEN orders_region = 'north' THEN orders_revenue ELSE 0 END)"></hdml-field>
      <hdml-field name="south" type="float-64"
        clause="SUM(CASE WHEN orders_region = 'south' THEN orders_revenue ELSE 0 END)"></hdml-field>
      <hdml-field name="east" type="float-64"
        clause="SUM(CASE WHEN orders_region = 'east' THEN orders_revenue ELSE 0 END)"></hdml-field>
      <hdml-field name="series_max" type="float-64"
        clause="GREATEST(
                  SUM(CASE WHEN orders_region = 'north' THEN orders_revenue ELSE 0 END),
                  SUM(CASE WHEN orders_region = 'south' THEN orders_revenue ELSE 0 END),
                  SUM(CASE WHEN orders_region = 'east' THEN orders_revenue ELSE 0 END))"></hdml-field>
      <!-- domain-only sort key: 'MMM' strings sort alphabetically, so row
           order is pinned by the month NUMBER instead -->
      <hdml-field name="month_num" type="int-32"
        clause="MIN(month(orders_order_month))"></hdml-field>
      <hdml-group-by><hdml-field name="month"></hdml-field></hdml-group-by>
      <hdml-sort-by><hdml-field name="month_num" order="asc"></hdml-field></hdml-sort-by>
    </hdml-frame>

    <!-- monthly performance, as in 07 -->
    <hdml-frame name="monthly_perf" source="/warehouse/sales.html?hdml-model=sales">
      <hdml-field name="month" type="utf-8"
        clause="format_datetime(orders_order_month, 'MMM')"></hdml-field>
      <hdml-field name="revenue" origin="orders_revenue" type="float-64"
                  aggregation="sum"></hdml-field>
      <hdml-field name="margin" type="float-64"
        clause="AVG((orders_revenue - orders_cost) / NULLIF(orders_revenue, 0))"></hdml-field>
      <!-- domain-only sort key: 'MMM' strings sort alphabetically, so row
           order is pinned by the month NUMBER instead -->
      <hdml-field name="month_num" type="int-32"
        clause="MIN(month(orders_order_month))"></hdml-field>
      <hdml-group-by><hdml-field name="month"></hdml-field></hdml-group-by>
      <hdml-sort-by><hdml-field name="month_num" order="asc"></hdml-field></hdml-sort-by>
    </hdml-frame>

    <figure class="panels">
      <figcaption id="cap-panels">A — revenue by month, one panel per region (authored
        small multiples; all panels share one query and one y domain)</figcaption>
      <!-- source once, on the view: all three planes inherit it -->
      <hdml-view source="?hdml-frame=regional_m" aria-labelledby="cap-panels">

        <hdml-cartesian-plane class="north">
          <hdml-ordinal-scale channel="x" values="month">
            <hdml-continuous-scale channel="y" min="0" values="series_max" nice>
              <hdml-axis channel="x"></hdml-axis>
              <hdml-axis channel="y"></hdml-axis>
              <hdml-label channel="x"></hdml-label>
              <hdml-label channel="y" count="4" format="compact-short"></hdml-label>
              <hdml-bar x="month" y="north"></hdml-bar>
            </hdml-continuous-scale>
          </hdml-ordinal-scale>
        </hdml-cartesian-plane>

        <hdml-cartesian-plane class="south">
          <hdml-ordinal-scale channel="x" values="month">
            <hdml-continuous-scale channel="y" min="0" values="series_max" nice>
              <hdml-axis channel="x"></hdml-axis>
              <hdml-label channel="x"></hdml-label>
              <hdml-bar x="month" y="south"></hdml-bar>
            </hdml-continuous-scale>
          </hdml-ordinal-scale>
        </hdml-cartesian-plane>

        <hdml-cartesian-plane class="east">
          <hdml-ordinal-scale channel="x" values="month">
            <hdml-continuous-scale channel="y" min="0" values="series_max" nice>
              <hdml-axis channel="x"></hdml-axis>
              <hdml-label channel="x"></hdml-label>
              <hdml-bar x="month" y="east"></hdml-bar>
            </hdml-continuous-scale>
          </hdml-ordinal-scale>
        </hdml-cartesian-plane>

      </hdml-view>
      <div class="titles" aria-hidden="true">
        <span>North</span><span>South</span><span>East</span>
      </div>
    </figure>

    <figure class="overlay">
      <figcaption id="cap-overlay">B — margin detail over a full-bleed revenue context
        band (two plot regions on one canvas)</figcaption>
      <hdml-view source="?hdml-frame=monthly_perf" aria-labelledby="cap-overlay">

        <!-- context: zero padding, no guides — pure texture -->
        <hdml-cartesian-plane class="context">
          <hdml-ordinal-scale class="points" channel="x" values="month">
            <hdml-continuous-scale channel="y" min="0" values="revenue">
              <hdml-area x="month" y0="0" y1="revenue"></hdml-area>
            </hdml-continuous-scale>
          </hdml-ordinal-scale>
        </hdml-cartesian-plane>

        <!-- detail: padded, guided; paints over the context -->
        <hdml-cartesian-plane class="detail">
          <hdml-ordinal-scale class="points" channel="x" values="month">
            <hdml-continuous-scale channel="y" min="0" max="0.4">
              <hdml-axis channel="x"></hdml-axis>
              <hdml-axis channel="y"></hdml-axis>
              <hdml-label channel="x"></hdml-label>
              <hdml-label channel="y" count="5" format="percent precision-integer"></hdml-label>
              <hdml-line x="month" y="margin"></hdml-line>
            </hdml-continuous-scale>
          </hdml-ordinal-scale>
        </hdml-cartesian-plane>

      </hdml-view>
    </figure>
  </body>
</html>
